plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meiyan.ime'
    compileSdk 34

    defaultConfig {
        applicationId "com.meiyan.ime"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('mira-debug.keystore')
            storePassword 'android'
            keyAlias 'mira'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'onnx'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    def sherpa = file('libs/sherpa-onnx-1.12.18.aar')
    if (sherpa.exists()) {
        implementation files(sherpa)
    }
}